name: Downstream CI and image

on:
  pull_request:
    branches: [downstream]
  push:
    branches: [downstream]
  workflow_dispatch:

concurrency:
  group: downstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          install_args: node pnpm

      - name: Install server dependencies
        run: |
          pnpm install --filter immich --frozen-lockfile
          pnpm --filter @immich/sdk --filter @immich/plugin-sdk install --frozen-lockfile

      - name: Build server workspace dependencies
        run: pnpm --filter @immich/sdk --filter @immich/plugin-sdk build

      - name: Run server checks
        run: |
          pnpm --dir server format
          pnpm --dir server lint
          pnpm --dir server check
          pnpm --dir server test --run

  image:
    name: Build downstream server image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.version' server/package.json)"
          short_sha="${GITHUB_SHA:0:12}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/immich-server"
          tag="v${version}-ro-metadata.${short_sha}"
          {
            echo "image=${image}"
            echo "tag=${tag}"
            echo "full=${image}:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,format=long,prefix=commit-
          labels: |
            org.opencontainers.image.description=Immich server with the Cadenzai read-only metadata persistence patch
            org.opencontainers.image.source=https://github.com/cadenzai/immich
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=immich-server-amd64
          cache-to: type=gha,mode=max,scope=immich-server-amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ steps.version.outputs.full }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
